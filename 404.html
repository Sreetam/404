<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Oopsie!</title>
  <style>
    body {
      background-color: #ffffff;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      color: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }

    h1 {
      font-size: 5rem;
      margin: 0.2em;
    }

    h2 {
      font-size: 2rem;
      margin: 0.3em;
      font-family: Arial, sans-serif;
    }

    blockquote {
      font-style: italic;
      margin: 1em;
      font-family: Georgia, serif;
    }

    cite {
      display: block;
      margin-top: 0.5em;
      font-size: 0.9em;
      color: #666;
    }

    .go-back {
      margin-top: 1.5em;
      padding: 0.8em 2em;
      font-size: 1.2em;
      border: 2px solid #333;
      border-radius: 8px;
      background-color: #fff;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: Arial, sans-serif;
    }

    .go-back:hover {
      animation: shake 0.3s ease infinite;
      background-color: #f8f8f8;
    }

    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-5px); }
      100% { transform: translateX(0); }
    }

    footer {
      position: absolute;
      bottom: 1em;
      font-size: 0.9em;
      color: #444;
    }
  </style>
</head>
<body>

  <h1>Oops!</h1>
  <h2>ERROR 404</h2>

  <p id="quip">Something went wrong...</p>

  <blockquote>
    <span id="quote">Loading quote...</span><br>
    <cite id="who">– the universe</cite>
  </blockquote>

  <button class="go-back" onclick="history.back()">Go Back</button>

  <footer>
    Proudly powered by duct tape and vibes
  </footer>

  <script>
    const messages = [
  {
    p: "This page has gone to lunch. It left no forwarding address.",
    q: "It is an ex-page. It has shuffled off this virtual coil.",
    c: "– The Department of Dead Pages"
  },
  {
    p: "This URL has been reassigned to the Ministry of Redundancy Ministry.",
    q: "Please submit form 27B/6 in triplicate to continue.",
    c: "– Sir Reginald Q. Bureaucrat, Esq."
  },
  {
    p: "The page you are looking for has been sacked.",
    q: "The new page creators have also been sacked.",
    c: "– Monty Python and the Holy 404"
  },
  {
    p: "404? That’s not a page, that’s a Norwegian Blue!",
    q: "Beautiful plumage, but it’s nailed to the perch.",
    c: "– The Pet Shop Owner"
  },
  {
    p: "This page was last seen arguing with a penguin on the television set.",
    q: "It stormed out, muttering something about spam.",
    c: "– BBC Complaint Department"
  },
  {
    p: "This page was eaten by a giant hedgehog named Dinsdale.",
    q: "Dinsdale was *very* persuasive.",
    c: "– Spiny Norman"
  },
  {
    p: "This is not a 404. It’s a 403 wearing a silly hat.",
    q: "Do not question the hat. The hat has diplomatic immunity.",
    c: "– Colonel Boaty McLegface"
  },
  {
    p: "We apologise for the fault in the page.",
    q: "Those responsible have been sacked. Again.",
    c: "– The Apology Committee"
  },
  {
    p: "This page has been replaced by a nice bit of cheese.",
    q: "Unfortunately, the cheese has also gone missing.",
    c: "– The Cheese Shop Proprietor"
  },
  {
    p: "This page is unavailable due to an outbreak of Spanish Inquisition.",
    q: "Nobody expected it.",
    c: "– Cardinal Ximénez"
  },
  {
    p: "The intern unplugged something again.",
    q: "The page you seek… does not exist.<br>Just like your GPA.",
    c: "– Probably someone sometime"
  },
  {
    p: "Your weekend plans are more real than this URL.",
    q: "404. Like that assignment you forgot.",
    c: "– Your professor, probably"
  },
  {
    p: "This page has ceased to be. It’s pushing up daisies.",
    q: "This is an ex-page!",
    c: "– Monty Python (probably)"
  },
  {
    p: "Reality not found. Try again after coffee.",
    q: "You've gone too far, traveler. Turn back now.",
    c: "– The Server Whisperer"
  },
  {
    p: "Congratulations. You broke the internet.",
    q: "There is no page. There never was. Only Zuul.",
    c: "– Ghostbusters’ IT department"
  },
  {
    p: "This page went out to buy milk and never came back.",
    q: "We're all waiting. But it's not coming home.",
    c: "– Disappointed England fan"
  },
  {
    p: "Oops! We lost the page in a quantum entanglement.",
    q: "Technically it both exists and doesn't.",
    c: "– Schrödinger’s Dev Team"
  },
  {
    p: "It was working in prod. Until you showed up.",
    q: "404: Blame not found. Try again.",
    c: "– DevOps, frantically Googling"
  },
  {
    p: "This page has been moved to another timeline.",
    q: "Please contact Doctor Strange for access.",
    c: "– The Multiversal IT Desk"
  },
  {
    p: "Nothing to see here. Literally.",
    q: "This space intentionally left empty. For vibes.",
    c: "– Existential Frontend Philosophy"
  },
  {
    p: "Page not found. But at least you're trying.",
    q: "That’s more than we can say for the page.",
    c: "– Your therapist, probably"
  },
  {
    p: "Our server is having an identity crisis.",
    q: "It doesn't know what page it is anymore.",
    c: "– Digital Jungian Analysts"
  },
  {
    p: "You summoned a 404 demon. It eats broken links.",
    q: "Quick! Throw a valid URL to appease it!",
    c: "– Dungeon Master, panicking"
  },
  {
    p: "Whoops, we rolled a natural 1 on page loading.",
    q: "Critical failure: Missing content.",
    c: "– Your favorite bard"
  },
  {
    p: "Our AI overlord deemed this page unworthy.",
    q: "It’s been recycled into training data.",
    c: "– GPT-9000"
  }
];

    const pick = messages[Math.floor(Math.random() * messages.length)];
    document.getElementById("quip").innerHTML = pick.p;
    document.getElementById("quote").innerHTML = pick.q;
    document.getElementById("who").innerHTML = pick.c;
  </script>

</body>
</html>
